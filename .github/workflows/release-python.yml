name: Release Python SDK

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release label
        id: label
        shell: bash
        run: |
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'

          count=0
          bump=""
          for candidate in major minor patch; do
            if [[ "$labels" == *"release:${candidate}"* ]]; then
              count=$((count + 1))
              bump="$candidate"
            fi
          done

          if [[ $count -gt 1 ]]; then
            echo "Multiple release labels found. Use exactly one of release:major|minor|patch."
            exit 1
          fi

          if [[ $count -eq 0 ]]; then
            echo "release=none" >> "$GITHUB_OUTPUT"
            echo "No release label found. Skipping release."
            exit 0
          fi

          echo "release=$bump" >> "$GITHUB_OUTPUT"

      - name: Stop when no release label
        if: steps.label.outputs.release == 'none'
        run: echo "No release label found. Workflow exiting successfully."

      - name: Read version from pyproject
        if: steps.label.outputs.release != 'none'
        id: version
        shell: bash
        run: |
          python - << 'PY'
          import os
          import re
          from pathlib import Path

          text = Path("python/pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"(\d+\.\d+\.\d+)"\s*$', text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find [project].version in python/pyproject.toml")

          version = match.group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
          PY

      - name: Fail if tag already exists
        if: steps.label.outputs.release != 'none'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists."
            exit 1
          fi

      - name: Create and push release tag
        if: steps.label.outputs.release != 'none'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"

      - name: Setup Python
        if: steps.label.outputs.release != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distribution
        if: steps.label.outputs.release != 'none'
        run: |
          python -m pip install --upgrade pip build
          python -m build python/

      - name: Publish to PyPI
        if: steps.label.outputs.release != 'none'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        if: steps.label.outputs.release != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ github.event.pull_request.body }}
          generate_release_notes: true
